<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>给你的胶片旅行</title>
    <meta name="description" content="一页关于音乐、照片、时间轴和一封信的温柔纪念网页。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow" id="heroEyebrow">Our Little Journey</p>
          <h1 id="page-title">给你的胶片旅行</h1>
          <p class="hero-text" id="heroText">把音乐、城市、照片和想说的话收进同一页。</p>
        </div>
        <div class="music-panel" aria-label="音乐播放器">
          <span class="music-label" id="musicLabel">灰色</span>
          <audio controls preload="metadata" id="musicAudio">
            <source id="musicSource" src="gray.mp3" type="audio/mpeg" />
            当前浏览器不支持音频播放。
          </audio>
        </div>
      </section>

      <section class="timeline" id="timeline" aria-label="旅行时间轴"></section>

      <section class="letter-section" aria-labelledby="letter-title">
        <p class="eyebrow" id="letterEyebrow">A Letter</p>
        <h2 id="letter-title">还有一封想慢慢读给你的信</h2>
        <button class="letter-button" type="button" id="openLetter">打开这封信</button>
      </section>
    </main>

    <a class="admin-entry" href="admin.html" aria-label="打开内容管理入口">管理</a>

    <div class="modal" id="letterModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-letter></div>
      <section class="letter-paper" role="dialog" aria-modal="true" aria-labelledby="letterDialogTitle">
        <button class="close-button" type="button" id="closeLetter" aria-label="关闭情书">×</button>
        <p class="paper-date" id="paperDate">写给你</p>
        <h2 id="letterDialogTitle">亲爱的你</h2>
        <div class="letter-content" id="letterContent">正在展开这封信……</div>
      </section>
    </div>

    <div class="lightbox" id="photoLightbox" aria-hidden="true">
      <button class="lightbox-close" type="button" id="closePhoto" aria-label="关闭照片">×</button>
      <img id="lightboxImage" alt="" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
